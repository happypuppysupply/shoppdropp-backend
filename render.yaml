services:
  - type: web
    name: shoppdropp-api
    runtime: node
    plan: pro
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.lendsquid.ai
      - key: CORS_ORIGIN
        value: https://www.lendsquid.ai
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HETZNER_API_TOKEN
        sync: false
      - key: CJ_DROPSHIPPING_API_KEY
        sync: false
      - key: SSH_PRIVATE_KEY
        sync: false